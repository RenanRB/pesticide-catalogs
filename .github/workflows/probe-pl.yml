name: probe pl (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the register page and its XLSX
        run: |
          set -x
          mkdir out
          curl -sSL -m 60 -A 'Mozilla/5.0 (X11; Linux x86_64)' -o out/page.html -w '%{http_code}\n' https://www.gov.pl/web/rolnictwo/rejestr-rodkow-ochrony-roslin || true
          ls -la out
          grep -o -E 'href="/attachment/[^"]+"[^>]*>[^<]*' out/page.html | head -20 || true
          grep -o -E '/attachment/[0-9a-f-]{36}' out/page.html | sort -u | head -20 > out/links.txt || true
          for a in $(cat out/links.txt); do curl -sSL -m 60 -A 'Mozilla/5.0' -D - -o "out/$(basename $a).bin" "https://www.gov.pl$a" | grep -i -E 'content-disposition|content-type|HTTP/' ; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pl
          path: out
