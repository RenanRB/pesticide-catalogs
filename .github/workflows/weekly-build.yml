name: weekly catalogs

on:
  schedule:
    # Wednesdays 09:23 UTC: EPA updates PPIS on Tuesday, E-Phy on Tuesday night, the others weekly or less.
    - cron: '23 9 * * 3'
  workflow_dispatch:
    inputs:
      country:
        description: 'One country (us, fr, it, ar, mx, gr) or empty for all'
        required: false

permissions:
  contents: write

concurrency:
  group: catalogs-data-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Mexico pages through COFEPRIS's HTML search, ~590 pages of 3–20 s each.
    timeout-minutes: ${{ matrix.country == 'mx' && 330 || 30 }}
    strategy:
      # One country failing (its source down or changed) never blocks the others.
      fail-fast: false
      max-parallel: 1
      matrix:
        country: [us, fr, it, ar, gr, mx]

    steps:
      - name: Checkout repository
        if: ${{ !inputs.country || inputs.country == matrix.country }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ !inputs.country || inputs.country == matrix.country }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Greece ships an MS Access database: mdb-export reads it.
      - name: Install mdbtools
        if: ${{ matrix.country == 'gr' && (!inputs.country || inputs.country == matrix.country) }}
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Test the parsers
        if: ${{ !inputs.country || inputs.country == matrix.country }}
        run: node --test

      # Writes data/<country>/ only when its product list changed; fails (and keeps the
      # published files) when the source is unreachable, its layout changed or too few
      # products came out.
      - name: Build the catalog
        if: ${{ !inputs.country || inputs.country == matrix.country }}
        run: node ${{ matrix.country }}/build.mjs

      - name: Commit updated data
        if: ${{ !inputs.country || inputs.country == matrix.country }}
        run: |
          if git diff --quiet -- data/${{ matrix.country }}; then
            echo "Data unchanged."
            exit 0
          fi
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/${{ matrix.country }}
          git commit -m "Update ${{ matrix.country }} catalog"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
